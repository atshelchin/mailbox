services:
  mailbox:
    image: mailbox:${VERSION:-latest}
    container_name: mailbox
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5005}:5005"
      - "${SMTP_PORT:-25}:25"
    volumes:
      - mailbox-data:/data
    environment:
      - SERVICE_DOMAIN=${SERVICE_DOMAIN}
      - OFFICIAL_DOMAINS=${OFFICIAL_DOMAINS}
      - RP_NAME=${RP_NAME}
      - RP_ID=${RP_ID}
      - ORIGIN=${ORIGIN}
      - MAX_EMAIL_SIZE=${MAX_EMAIL_SIZE:-104857600}
      - EMAIL_RETENTION_HOURS=${EMAIL_RETENTION_HOURS:-24}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-604800000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mailbox-data:
